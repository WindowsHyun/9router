services:
  9router:
    # Built here, not pulled: the published image is upstream's and does not
    # contain Claude Code, so `image:` would silently give you a router where
    # the claude-cli provider cannot work. Swap to
    #   image: decolua/9router:latest
    # if you do not want that provider and would rather skip the build.
    build:
      context: .
    image: 9router-local:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
      # The bridge is a sibling container, not loopback. 9Router accepts any
      # private/container address for it and still refuses public ones, so the
      # ChatGPT session can never be sent off this network.
      CHATGPT_WEB_BASE_URL: http://chatgpt-web:17841
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

  # ChatGPT Web bridge. Signing in to chatgpt.com needs a real browser once, so
  # this container runs one on a virtual display and publishes it over noVNC.
  # Sign in from the dashboard: ChatGPT Web bridge → Login, which serves this
  # window through the router's own origin. It then stays signed in.
  #
  # It is a build, not a pulled image, because upstream publishes desktop
  # installers rather than a container. First build takes a few minutes.
  chatgpt-web:
    build:
      context: ./docker/chatgpt-web
      args:
        # Pinned so a rebuild cannot change what routed requests run on.
        BRIDGE_VERSION: v5.0.8
        # Korea: mirror.kakao.com or ftp.lanet.kr. Default is the official.
        APT_MIRROR_HOST: deb.debian.org
    container_name: 9router-chatgpt-web
    restart: always
    ports:
      # Sign-in UI, for debugging only — the dashboard's Login button proxies
      # this same console behind your login, so nothing here needs publishing.
      # Bound to localhost because the window is a signed-in ChatGPT session
      # with no authentication of its own.
      - "127.0.0.1:6080:6080"
    volumes:
      - chatgpt-web-profile:/data/profile
    # Chromium needs more than the default 64 MB of shared memory or tabs crash.
    shm_size: "1gb"
    # 17841 is deliberately NOT published: only 9router needs it, over the
    # compose network.
    expose:
      - "17841"

volumes:
  9router-data:
    name: 9router-data
  chatgpt-web-profile:
    name: 9router-chatgpt-web-profile
