services:
  9router:
    # Built here, not pulled: the published image is upstream's and does not
    # contain Claude Code, so `image:` would silently give you a router where
    # the claude-cli provider cannot work. Swap to
    #   image: decolua/9router:latest
    # if you do not want that provider and would rather skip the build.
    build:
      context: .
    image: 9router-local:latest
    container_name: 9router
    restart: always
    ports:
      - "20128:20128"
    volumes:
      - 9router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    depends_on:
      - headroom

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: always
    ports:
      - "8787:8787"

volumes:
  9router-data:
    name: 9router-data
